spring.application.name=backend

# PostgreSQL Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/mend}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:mend_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:mend_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# Redis Configuration
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
mend.redis.stream-name=${MEND_REDIS_STREAM_NAME:mend:webhooks}
mend.redis.consumer-group=${MEND_REDIS_CONSUMER_GROUP:mend-processors}
mend.redis.enabled=${MEND_REDIS_ENABLED:true}
mend.redis.retry.max-attempts=${MEND_REDIS_RETRY_MAX_ATTEMPTS:3}

# AI Classification Service
mend.ai.base-url=${MEND_AI_BASE_URL:http://localhost:8000}
mend.ai.connect-timeout-ms=${MEND_AI_CONNECT_TIMEOUT_MS:2000}
mend.ai.read-timeout-ms=${MEND_AI_READ_TIMEOUT_MS:3000}

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baselineOnMigrate=false

# Razorpay Webhook Configuration
razorpay.webhook.secret=${RAZORPAY_WEBHOOK_SECRET:default_test_webhook_secret}
