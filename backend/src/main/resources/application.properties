spring.application.name=backend
# No default profile (cleanup Group 7): without SPRING_PROFILES_ACTIVE the app runs the "default" profile, with no dev
# seed and no /api/v1/demo. Local development sets SPRING_PROFILES_ACTIVE=dev explicitly (see README).

# PostgreSQL Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/mend}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:mend_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:mend_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# Redis Configuration
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
mend.redis.stream-name=${MEND_REDIS_STREAM_NAME:mend:webhooks}
mend.redis.consumer-group=${MEND_REDIS_CONSUMER_GROUP:mend-webhook-processors}
mend.redis.enabled=${MEND_REDIS_ENABLED:true}
mend.redis.retry.max-attempts=${MEND_REDIS_RETRY_MAX_ATTEMPTS:3}

# Transactional outbox (PostgreSQL -> Redis)
mend.outbox.publisher.scheduled-enabled=${MEND_OUTBOX_PUBLISHER_ENABLED:true}
mend.outbox.publisher.poll-interval-ms=${MEND_OUTBOX_POLL_INTERVAL_MS:1000}
mend.outbox.publisher.batch-size=${MEND_OUTBOX_BATCH_SIZE:50}
mend.outbox.publisher.retry-base-delay-seconds=${MEND_OUTBOX_RETRY_BASE_DELAY_SECONDS:1}
mend.outbox.publisher.retry-max-delay-seconds=${MEND_OUTBOX_RETRY_MAX_DELAY_SECONDS:300}

# AI Classification Service
mend.ai.base-url=${MEND_AI_BASE_URL:http://localhost:8000}
mend.ai.connect-timeout-ms=${MEND_AI_CONNECT_TIMEOUT_MS:2000}
mend.ai.read-timeout-ms=${MEND_AI_READ_TIMEOUT_MS:3000}
mend.ai.internal-token=${MEND_AI_INTERNAL_TOKEN:}

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baselineOnMigrate=false

# Payment Provider Configuration
mend.payment.provider=${MEND_PAYMENT_PROVIDER:mock}

# Razorpay API Configuration
razorpay.api.base-url=${RAZORPAY_API_BASE_URL:https://api.razorpay.com}
razorpay.key-id=${RAZORPAY_KEY_ID:}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
razorpay.connect-timeout-ms=${RAZORPAY_CONNECT_TIMEOUT_MS:5000}
razorpay.read-timeout-ms=${RAZORPAY_READ_TIMEOUT_MS:10000}
razorpay.single-tenant-merchant-id=${RAZORPAY_SINGLE_TENANT_MERCHANT_ID:}

# Razorpay Webhook Configuration
razorpay.webhook.secret=${RAZORPAY_WEBHOOK_SECRET:}

# JWT Configuration
# No default secret: outside the dev and test profiles JWT_SECRET is required (at least 32 bytes),
# and JwtService refuses to start without it.
jwt.secret=${JWT_SECRET:}
jwt.expiration=${JWT_EXPIRATION:86400000}
# CORS Configuration
mend.cors.allowed-origins=${MEND_CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Dev Data Seeding Configuration (SAFE default = false)
mend.dev.seed=${MEND_DEV_SEED:false}

# M2 execution reconciler (ADR-002 OD-2 / OD-3)
mend.reconciler.enabled=true
mend.reconciler.scheduled-enabled=true
mend.reconciler.poll-interval-ms=15000
mend.reconciler.batch-size=50
mend.reconciler.lease-seconds=60
mend.reconciler.stuck-seconds=120
mend.reconciler.not-found-grace-seconds=120
mend.reconciler.max-execution-attempts=3
mend.reconciler.deferral-cap=5
mend.reconciler.backoff-base-seconds=30
mend.reconciler.backoff-cap-seconds=21600
mend.recovery.link-ttl-hours=72

# Action scheduler and claims (defaults as in code; tests set scheduled-enabled=false and drive the scheduler directly)
mend.scheduler.enabled=true
mend.scheduler.scheduled-enabled=true
mend.scheduler.poll-interval-ms=5000
mend.scheduler.batch-size=50
mend.scheduler.lease-duration-minutes=5
mend.scheduler.default-retry-delay-minutes=15
# Empty = a generated worker id per instance
mend.scheduler.worker-id=

# Redis webhook consumer (tests set scheduled-enabled=false and poll explicitly)
mend.consumer.scheduled-enabled=true
mend.consumer.poll-interval-ms=2000

# M3 U2.2: no AI confidence thresholds; compliance and strategy are deterministic (ADR-003).

# M2 U9: MEND-side failures (not sent, rate limited, no credentials, amount unresolved) defer instead of exhausting (OD-3).
mend.execution.max-deferrals=5
mend.execution.defer-backoff-base-seconds=30
mend.execution.defer-backoff-cap-seconds=21600

# Pre-M3 hygiene: /api/v1/demo (DemoController) exists only when enabled; it runs SIMULATED scenarios. Off by default.
mend.demo.enabled=false
