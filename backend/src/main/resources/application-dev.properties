# Local Development Profile Configuration
mend.dev.seed=true
# Pre-M3 hygiene: the SIMULATED demo scenarios (/api/v1/demo) are available in the dev profile only.
mend.demo.enabled=true
# Dev-only JWT secret (public). Every other profile must set JWT_SECRET.
jwt.secret=${JWT_SECRET:dev_default_jwt_secret_key_must_be_at_least_32_bytes_long}
