spring.datasource.url=jdbc:postgresql://localhost:5432/mend
spring.datasource.username=mend_user
spring.datasource.password=mend_password
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.format_sql=false

# Flyway Configuration - must run BEFORE Hibernate validates
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.clean-disabled=false
spring.flyway.url=${spring.datasource.url}
spring.flyway.user=${spring.datasource.username}
spring.flyway.password=${spring.datasource.password}
debug=true
logging.level.root=INFO
logging.level.org.flyway=TRACE
logging.level.org.flywaydb=TRACE
logging.level.org.springframework.boot.autoconfigure.flyway=DEBUG
