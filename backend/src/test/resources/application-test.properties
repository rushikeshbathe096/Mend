# Pre-M3 hygiene: the URL of this run's own database, created and dropped by com.mend.testsupport.IsolatedTestDatabase.
# No fallback on purpose: without it the context fails to start instead of writing into the dev database.
spring.datasource.url=${mend.test.datasource.url}
spring.datasource.username=mend_user
spring.datasource.password=mend_password
# Each cached Spring test context keeps its own pool; let idle ones shrink so the run stays far below max_connections.
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=10000
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.format_sql=false

# Flyway Configuration - must run BEFORE Hibernate validates
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.clean-disabled=false
spring.flyway.url=${spring.datasource.url}
spring.flyway.user=${spring.datasource.username}
spring.flyway.password=${spring.datasource.password}
debug=true
logging.level.root=INFO
logging.level.org.flyway=TRACE
logging.level.org.flywaydb=TRACE
logging.level.org.springframework.boot.autoconfigure.flyway=DEBUG

# JWT Test Configuration
jwt.secret=test_secret_key_123456789012345678901234567890
jwt.expiration=3600000

# Webhook Test Configuration
razorpay.webhook.secret=default_test_webhook_secret

# Dev Data Seeding Configuration
mend.dev.seed=true

# Integration tests invoke ActionScheduler methods explicitly; prevent the live
# scheduled poller from racing test setup and external-provider assertions.
mend.scheduler.scheduled-enabled=false

# Tests invoke the outbox publisher explicitly to make failure boundaries deterministic.
mend.outbox.publisher.scheduled-enabled=false
# M2: tests drive the reconciler explicitly (runCycle); the background schedule stays off.
mend.reconciler.scheduled-enabled=false
