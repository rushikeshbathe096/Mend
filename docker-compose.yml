services:
  postgres:
    image: postgres:17-alpine
    container_name: mend-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mend}
      POSTGRES_USER: ${POSTGRES_USER:-mend_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mend_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mend_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mend-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: mend-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mend-network
    restart: unless-stopped
    command: redis-server --appendonly yes

volumes:
  postgres_data:
  redis_data:

networks:
  mend-network:
    driver: bridge
