# MEND CI. Every job only calls scripts/ci/*.sh, so running those scripts locally reproduces the pipeline.
# No repository secrets are needed: the backend gets a JWT_SECRET generated per run, and the tests use their own profile.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: mend_user
          POSTGRES_PASSWORD: mend_password
          POSTGRES_DB: mend
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mend_user" --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      MEND_TEST_DB_SERVER_URL: jdbc:postgresql://localhost:5432/postgres
      MEND_TEST_DB_USER: mend_user
      MEND_TEST_DB_PASSWORD: mend_password
      REDIS_HOST: localhost
      REDIS_PORT: "6379"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Generate a throwaway JWT secret
        run: |
          secret="$(openssl rand -base64 48)"
          echo "::add-mask::$secret"
          echo "JWT_SECRET=$secret" >> "$GITHUB_ENV"
      - run: scripts/ci/backend.sh

  migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: mend_user
          POSTGRES_PASSWORD: mend_password
          POSTGRES_DB: mend
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mend_user" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      MEND_TEST_DB_SERVER_URL: jdbc:postgresql://localhost:5432/postgres
      MEND_TEST_DB_USER: mend_user
      MEND_TEST_DB_PASSWORD: mend_password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: scripts/ci/migrations.sh

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: scripts/ci/frontend.sh

  ai-service:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: mend_user
          POSTGRES_PASSWORD: mend_password
          POSTGRES_DB: mend
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U mend_user" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      MEND_CHECKPOINT_POSTGRES_URI: postgresql://mend_user:mend_password@localhost:5433/mend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai-service/requirements.txt
      - run: scripts/ci/ai-service.sh

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read   # gitleaks-action lists the PR's commits on pull_request events
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
